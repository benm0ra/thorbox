# SPDX-License-Identifier: GPL-3.0-or-later
name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read          # least privilege for every job

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  host-tests:
    name: Engine tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/run-host-tests.sh

  android:
    name: Build + lint
    needs: [wrapper, host-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      # Same version + key as releases (when the secret exists), so CI APKs install over releases too.
      # Pull requests from forks / Dependabot get no secrets and fall back to the local debug key.
      - name: Version + signing key
        env:
          KS: ${{ secrets.THORBOX_KEYSTORE_B64 }}
        run: |
          echo "THORBOX_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "THORBOX_VERSION_NAME=0.0.0-ci.$(git rev-list --count HEAD)+$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "THORBOX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi
      # Build first and lint second, so the APK is produced (and uploaded) even when lint fails.
      - run: ./gradlew :app:assembleDebug --stacktrace
        env:
          THORBOX_KEYSTORE_PASSWORD: ${{ secrets.THORBOX_KEYSTORE_PASSWORD }}
          THORBOX_KEY_ALIAS: ${{ secrets.THORBOX_KEY_ALIAS }}
          THORBOX_KEY_PASSWORD: ${{ secrets.THORBOX_KEY_PASSWORD }}
      - run: ./gradlew :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thorbox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 14

  # Boots an Android 13 emulator, installs an x86_64 build and checks the app actually stays open
  # (single screen and with a simulated second display). Catches launch crashes before a device does.
  smoke:
    name: Launch smoke test (emulator)
    needs: [wrapper, host-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: ./gradlew :app:assembleDebug -Pthorbox.abis=x86_64 --stacktrace
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: tools/smoke-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: smoke/
          retention-days: 14
