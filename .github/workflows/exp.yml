name: exp
on:
  push:
    branches: ['exp/**']
jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        run: ['0 SYNTH', '1 SYNTH', '2 SYNTH', '4 SYNTH', '8 SYNTH', '16 SYNTH', '0 DRUM', '0 DUCK']
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: ./gradlew :app:assembleDebug -Pthorbox.abis=x86_64
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: tools/exp-soak.sh ${{ matrix.run }}
