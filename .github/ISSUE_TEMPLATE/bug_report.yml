name: Bug report
description: Something broke, looks wrong or sounds wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Don't file it here; see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open SONG
        2. Tap PAT 2 while the song plays
        3. …
    validations: { required: true }
  - type: dropdown
    id: page
    attributes:
      label: Where in the app
      multiple: true
      options: [SAMPLE, SYNTH, DRUMS, STEPS, SONG, MIXER, DUCK, VISUAL, EXPORT, Bottom screen / decks, Settings, Projects, Gamepad / NAV, Other]
  - type: input
    id: version
    attributes:
      label: App version
      description: ⚙ → SYSTEM → VERSION
      placeholder: 0.0.0-ci.345+abc1234
    validations: { required: true }
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [AYN Thor, Another dual-screen device, A single-screen Android device, Emulator]
    validations: { required: true }
  - type: dropdown
    id: theme
    attributes:
      label: Theme (for anything visual)
      options: [Not visual, Genesis, Studio, Bodega, Cyberpunk, Vintage, Pastel, Terminal, Grayscale]
  - type: textarea
    id: log
    attributes:
      label: Log and screenshots
      description: ⚙ → SYSTEM → DIAGNOSTICS → SHARE LOG, plus screenshots of both screens if it's visual. For a sample that misbehaves, attach the smallest file that shows it (if you may share it).
